<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Цели</title>
<meta name="theme-color" content="#0F1218">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Цели">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ground:#EDEFF3; --surface:#FFFFFF; --surface-2:#F5F6F9;
  --ink:#141821; --ink-2:#565D6D; --ink-3:#8A90A0; --line:#DADDE5;
  --accent:#2F49D8; --accent-ink:#FFFFFF; --accent-soft:#DCE2FB;
  --done:#14905F; --done-soft:#D5F0E4; --track:#E3E6EE; --danger:#C8352B;
  --shadow:0 1px 2px rgba(20,24,33,.06),0 6px 20px rgba(20,24,33,.06);
  --scrim:rgba(14,17,24,.45);
  --display:"Unbounded",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F1218; --surface:#191D26; --surface-2:#20252F;
    --ink:#EEF0F5; --ink-2:#A6ACBA; --ink-3:#737A8A; --line:#2B313D;
    --accent:#7F93FF; --accent-ink:#0F1218; --accent-soft:#252E55;
    --done:#3FCB8E; --done-soft:#17362A; --track:#2A303B; --danger:#FF7468;
    --shadow:0 1px 2px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0F1218; --surface:#191D26; --surface-2:#20252F;
  --ink:#EEF0F5; --ink-2:#A6ACBA; --ink-3:#737A8A; --line:#2B313D;
  --accent:#7F93FF; --accent-ink:#0F1218; --accent-soft:#252E55;
  --done:#3FCB8E; --done-soft:#17362A; --track:#2A303B; --danger:#FF7468;
  --shadow:0 1px 2px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
body[data-mode="dark"]{
  --ground:#0F1218; --surface:#191D26; --surface-2:#20252F;
  --ink:#EEF0F5; --ink-2:#A6ACBA; --ink-3:#737A8A; --line:#2B313D;
  --accent:#7F93FF; --accent-ink:#0F1218; --accent-soft:#252E55;
  --done:#3FCB8E; --done-soft:#17362A; --track:#2A303B; --danger:#FF7468;
  --shadow:0 1px 2px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
body[data-mode="light"]{
  --ground:#EDEFF3; --surface:#FFFFFF; --surface-2:#F5F6F9;
  --ink:#141821; --ink-2:#565D6D; --ink-3:#8A90A0; --line:#DADDE5;
  --accent:#2F49D8; --accent-ink:#FFFFFF; --accent-soft:#DCE2FB;
  --done:#14905F; --done-soft:#D5F0E4; --track:#E3E6EE; --danger:#C8352B;
  --shadow:0 1px 2px rgba(20,24,33,.06),0 6px 20px rgba(20,24,33,.06);
  --scrim:rgba(14,17,24,.45); color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
body{margin:0;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
body{-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
html,body{background:var(--ground)}
body{color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{touch-action:pan-y;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}

/* header */
.head{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
h1{font:700 26px/1.1 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.period{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.period .dates{font:600 14px/1.3 var(--body)}
.period .dates.unset{color:var(--accent)}
.period .left{font:500 12px/1.3 var(--body);color:var(--ink-2);margin-top:2px}
.period .edit{font:600 12px var(--body);color:var(--accent);white-space:nowrap}
.period[disabled]{cursor:default}

.summary{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.big{font:700 40px/1 var(--mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big small{font-size:18px;color:var(--ink-3);margin-left:2px}
.sumtext{font-size:13px;color:var(--ink-2)}
.sumbar{height:6px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px}
.sumbar i{display:block;height:100%;background:var(--ink);border-radius:inherit;transition:width .3s}

/* goals */
.list{display:flex;flex-direction:column;gap:10px}
.goal{background:var(--surface);border-radius:16px;padding:14px 14px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;border:1px solid transparent}
.goal.is-done{border-color:var(--done);}
.row1{display:flex;align-items:flex-start;gap:10px}
.gtitle{flex:1;min-width:0;background:none;border:0;padding:2px 0;text-align:left;font:600 16px/1.3 var(--body);overflow-wrap:anywhere}
.gtitle .ex{display:inline-block;margin-left:6px;font:600 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:99px;padding:3px 6px;vertical-align:2px}
.badge{flex:none;font:700 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--done);background:var(--done-soft);padding:6px 8px;border-radius:99px}
.counter{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px}
.step{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;transition:transform .08s}
.step:active{transform:scale(.92)}
.step.plus{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.goal.is-done .step.plus{background:var(--done);border-color:var(--done)}
.step[disabled]{opacity:.35;cursor:default}
.step svg{width:20px;height:20px}
.mid{display:flex;flex-direction:column;gap:6px;min-width:0}
.nums{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.frac{font:700 20px/1 var(--mono);font-variant-numeric:tabular-nums}
.frac span{color:var(--ink-3);font-weight:500}
.pct{font:500 12px/1 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.goal.is-done .bar i{background:var(--done)}
.check{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:600 14px var(--body)}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink-3);display:grid;place-items:center;flex:none}
.goal.is-done .box{background:var(--done);border-color:var(--done);color:#fff}
.box svg{width:14px;height:14px}

.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:4px;padding:14px;border-radius:16px;border:1.5px dashed var(--line);background:transparent;font:600 15px var(--body);color:var(--ink-2)}
.add svg{width:18px;height:18px}
.empty{padding:28px 8px 8px;text-align:center;color:var(--ink-2);font-size:14px}
.empty b{display:block;font:700 17px/1.3 var(--display);color:var(--ink);margin-bottom:6px}
.note{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.note button{background:none;border:0;color:var(--accent);font-weight:700;font-size:12px;white-space:nowrap}
.sec{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:18px 2px 10px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:12px;color:var(--ink-3);font:600 11px/1.1 var(--body)}
.tab svg{width:24px;height:24px}
.tabs-in{position:relative}
.tab{position:relative;z-index:1;transition:color .25s}
.tab .pill{width:52px;height:30px;border-radius:99px;display:grid;place-items:center;transition:color .25s,transform .35s cubic-bezier(.3,1.5,.5,1)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] .pill{color:var(--accent);transform:translateY(-1px) scale(1.06)}
.ind.live{transition:none}
.ghost{position:fixed;bottom:0;z-index:1;pointer-events:none;background:var(--ground);overflow:hidden;margin:0}
.ind{position:absolute;top:6px;height:30px;width:52px;border-radius:99px;background:var(--accent-soft);z-index:0;
  left:calc((100% - 8px)/6 - 26px + var(--i,0) * ((100% - 8px)/3 + 4px));transition:left .38s cubic-bezier(.3,1.25,.5,1)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;overscroll-behavior:contain;animation:up .34s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{touch-action:none;cursor:grab;position:relative}
.grab::after{content:"";position:absolute;inset:-14px -60px}
.sheet h2{touch-action:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}.bar i,.sumbar i,.ind,.tab .pill,.toast{transition:none}*{animation:none!important}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font:700 18px/1.2 var(--display);margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.flabel{font:600 12px var(--body);color:var(--ink-2)}
.field input{width:100%;font:500 16px var(--body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.field input[type=number]{font-family:var(--mono)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font:600 14px var(--body);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;border-radius:12px;padding:13px;border:1px solid var(--line);background:var(--surface-2);font:700 15px var(--body)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{flex:none;color:var(--danger);background:transparent}
.hint{font-size:12px;color:var(--ink-3);margin:-6px 0 14px}
.err{color:var(--danger);font-size:12px;min-height:16px;margin:-6px 0 8px}
.pace{font:500 12px/1.35 var(--body);color:var(--ink-2);margin-top:-2px}
.pace b{color:var(--ink);font-weight:700}
.pace.late{color:var(--danger)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
html{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none;transition:transform .14s cubic-bezier(.2,.8,.2,1),background-color .2s,border-color .2s,color .2s}
.btn:active,.chip:active,.check:active,.add:active,.theme:active,.more:active,.period:not([disabled]):active,.seg button:active,.note button:active{transform:scale(.97)}
.step:active{transform:scale(.9)}
.tab:active .pill{transform:scale(.9)}
.gw{position:relative;will-change:transform;border-radius:16px}
.gw .goal{position:relative;z-index:1;touch-action:pan-y}
.celebrate .goal{animation:glow 1s ease-out}
.acts{position:absolute;top:0;right:0;bottom:0;width:176px;display:flex;gap:6px;padding:0 0 0 12px;align-items:stretch;opacity:0;pointer-events:none}
.gw.sw .acts{opacity:1;pointer-events:auto}
.acts button{flex:1;border:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:700 12px var(--body)}
.acts svg{width:20px;height:20px}
.acts .a-arch{background:var(--accent-soft);color:var(--accent)}
.acts .a-del{background:var(--danger);color:#fff}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--done) 55%,transparent)}100%{box-shadow:0 0 0 16px color-mix(in srgb,var(--done) 0%,transparent)}}
.celebrate .badge{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
.box svg path{stroke-dasharray:24;stroke-dashoffset:0}
.celebrate .box svg path{animation:draw .4s .05s ease-out both}
@keyframes draw{from{stroke-dashoffset:24}}
.goal.is-done .box{transition:background-color .2s,border-color .2s}
.handle{flex:none;width:32px;height:32px;margin:-4px -6px -4px 0;border:0;background:none;color:var(--ink-3);display:grid;place-items:center;border-radius:10px;touch-action:none;cursor:grab}
.handle svg{width:18px;height:18px}
.gw.dragging{z-index:5;transition:none!important;cursor:grabbing}
.gw.dragging .goal{box-shadow:0 12px 32px rgba(0,0,0,.22)}
.sorting .gw:not(.dragging){transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.archlink{display:flex;align-items:center;gap:6px;margin:14px auto 0;background:none;border:0;color:var(--ink-3);font:600 13px var(--body);padding:8px 12px;border-radius:10px}
.archlink svg{width:16px;height:16px}
.goal{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.goal.lifting{transform:scale(1.02);transition:transform .15s}
.subactions{display:flex;justify-content:center;gap:6px;margin-top:10px}
.subactions button{background:none;border:0;font:600 14px var(--body);color:var(--ink-2);padding:10px 14px;border-radius:10px}
.subactions .danger{color:var(--danger)}
.arow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.arow:first-of-type{border-top:0}
.arow .at{flex:1;min-width:0;font:600 15px/1.3 var(--body);overflow-wrap:anywhere}
.arow .as{display:block;font:500 12px var(--mono);color:var(--ink-3);margin-top:2px}
.arow button{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;font:600 12px var(--body)}
.arow button.del{color:var(--danger);background:transparent}
.agroup{font:600 11px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 4px}
.agroup:first-of-type{margin-top:4px}
.note.warn{background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--ink)}
.noteacts{display:flex;gap:4px;flex:none}
.noteacts button:first-child{color:var(--ink-3)}
.linkline{display:flex;align-items:center;gap:6px;font:600 11px/1.2 var(--body);color:var(--accent);margin-top:-4px}
.linkline svg{width:14px;height:14px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:8px 12px;font:600 13px/1.2 var(--body);text-align:left}
.chip .t{overflow-wrap:anywhere}
.chip .src{font:600 10px/1 var(--body);color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.chip .x{display:grid;place-items:center;width:18px;height:18px;border-radius:99px;background:var(--line);color:var(--ink);font-size:13px;line-height:1;margin-right:-4px}
.chiphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.chiphead button{background:none;border:0;color:var(--accent);font:700 12px var(--body);padding:4px 0}
.tick{display:flex;align-items:flex-start;gap:10px;font:500 14px/1.35 var(--body);margin:0 0 14px;cursor:pointer}
.tick input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
.tick small{display:block;color:var(--ink-3);font-size:12px}
.linkhint{font:600 12px/1.35 var(--body);color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:8px 10px;margin:-6px 0 14px}
.toprow{display:flex;align-items:center;gap:8px}
.toprow .eyebrow{flex:1}
.more{width:34px;height:34px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;flex:none}
.more svg{width:17px;height:17px}
.rec{font:600 12px/1.35 var(--body);color:var(--ink-2);margin-top:-2px;display:flex;align-items:center;gap:6px}
.rec.hot{color:#B7791F}
.rec svg{width:14px;height:14px;flex:none}
.recs{display:grid;grid-template-columns:1fr auto;gap:8px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px}
.recs .rl{font:500 13px/1.3 var(--body);color:var(--ink-2)}
.recs .rv{font:700 14px/1.3 var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.recs .rv small{display:block;font:500 11px var(--body);color:var(--ink-3)}
.recs .rh{grid-column:1/-1;font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.recs .rh svg{width:14px;height:14px;color:#D69E2E}
.rtitle{font:700 15px/1.3 var(--body);margin:16px 0 8px}
.sumcard{border-radius:18px;padding:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface) 70%);border:1px solid var(--line);margin-bottom:14px}
.sumcard .k{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.sumcard .pp{font:700 48px/1 var(--mono);margin:10px 0 4px;letter-spacing:-.03em}
.sumcard .pp small{font-size:20px;color:var(--ink-3)}
.sumcard .st{font:600 14px/1.35 var(--body);color:var(--ink-2)}
.cmp{display:inline-block;margin-top:10px;font:700 12px/1 var(--body);padding:6px 9px;border-radius:99px;background:var(--done-soft);color:var(--done)}
.cmp.down{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger)}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .t{font:600 14px/1.3 var(--body);overflow-wrap:anywhere}
.srow .v{font:700 13px var(--mono);text-align:right}
.srow .b{grid-column:1/-1;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.srow .b i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.srow.ok .b i{background:var(--done)}
.best{font:600 12px var(--body);color:var(--done);margin:-4px 0 12px}
.phrase{font:600 15px/1.45 var(--body);margin:-2px 0 14px;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.phrase b{color:var(--accent)}
.nycount{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;color:#fff;background:linear-gradient(120deg,#1B2356,#3B2A6B 60%,#6B2F5E);font:600 13px/1.35 var(--body)}
.nycount b{font:700 18px var(--mono);letter-spacing:.02em;color:#FFD98A;font-variant-numeric:tabular-nums}
#snow{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}
/* ---- новогоднее шоу ---- */
.nyshow{position:fixed;inset:0;z-index:60;color:#fff;background:radial-gradient(120% 80% at 50% 0%,#2A2F7A 0%,#12153A 45%,#07081A 100%);overflow:hidden;font-family:var(--body);-webkit-user-select:none;user-select:none;animation:fade .6s ease-out}
.nyshow canvas{position:absolute;inset:0;width:100%;height:100%}
.nybars{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:56px;display:flex;gap:5px;z-index:3}
.nybars i{flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
.nybars i b{display:block;height:100%;width:0;background:#fff}
.nybars i.done b{width:100%}
.nybars i.cur b{animation:nybar var(--d,6s) linear forwards}
@keyframes nybar{to{width:100%}}
.nyclose{position:absolute;top:calc(4px + env(safe-area-inset-top,0px));right:8px;width:40px;height:40px;border:0;background:none;color:#fff;font-size:26px;z-index:4;opacity:.8}
.nyslides{position:absolute;inset:0;z-index:2;display:grid}
.nyslide{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;padding:70px 24px calc(40px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;width:100%;opacity:0;pointer-events:none;transform:translateY(16px);transition:opacity .5s,transform .6s cubic-bezier(.2,.9,.25,1)}
.nyslide.on{opacity:1;pointer-events:auto;transform:none}
.nyk{font:700 12px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:#FFD98A;margin-bottom:14px}
.nyh{font:700 34px/1.12 var(--display);margin:0 0 14px;text-wrap:balance}
.nyh.sm{font-size:25px;line-height:1.25}
.nyp{font:500 17px/1.5 var(--body);color:rgba(255,255,255,.82);margin:0}
.nyyear{position:relative;height:120px;font:700 110px/1 var(--display);letter-spacing:-.04em;margin:6px 0 18px}
.nyyear span{position:absolute;left:0;top:0;transition:transform 1s cubic-bezier(.7,0,.2,1),opacity .8s}
.nyyear .old{color:rgba(255,255,255,.9)}
.nyyear .new{transform:translateY(90px);opacity:0;background:linear-gradient(90deg,#FFD98A,#FF8FB1,#9FD4FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.nyslide.flip .nyyear .old{transform:translateY(-90px);opacity:0}
.nyslide.flip .nyyear .new{transform:none;opacity:1}
.nystats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.nystat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
.on .nystat{opacity:1;transform:none}
.nystat .v{font:700 30px/1 var(--mono);color:#fff}
.nystat .l{font:500 12px/1.3 var(--body);color:rgba(255,255,255,.7);margin-top:6px}
.nystat.wide{grid-column:1/-1}
.nygoal{margin:12px 0}
.nygoal .t{display:flex;justify-content:space-between;gap:10px;font:600 15px var(--body)}
.nygoal .t span:last-child{font-family:var(--mono);color:#FFD98A}
.nygoal .b{height:8px;border-radius:9px;background:rgba(255,255,255,.14);margin-top:7px;overflow:hidden}
.nygoal .b i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#9FD4FF,#FF8FB1,#FFD98A);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.nybtns{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.nybtns button{border:0;border-radius:14px;padding:15px;font:700 16px var(--body)}
.nybtns .p{background:linear-gradient(90deg,#FFD98A,#FF8FB1);color:#1A1030}
.nybtns .s{background:rgba(255,255,255,.12);color:#fff}
.nytap{font:500 12px var(--body);color:rgba(255,255,255,.5);margin-top:26px}
.trashlink{display:flex;align-items:center;gap:6px;margin:14px auto 0;background:none;border:0;color:var(--ink-2);font:600 13px var(--body);padding:8px 12px;border-radius:10px}
.trashlink svg{width:15px;height:15px}
.agroup{display:flex;justify-content:space-between;align-items:center}
.agroup button{background:none;border:0;color:var(--accent);font:700 11px var(--body);letter-spacing:.04em;text-transform:none;padding:4px 0}
.theme{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:600 12px var(--body)}
.theme svg{width:16px;height:16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px) scale(.96);opacity:0;pointer-events:none;transition:opacity .22s ease,transform .3s cubic-bezier(.2,.9,.25,1);background:var(--ink);color:var(--ground);font:600 13px var(--body);padding:10px 14px;border-radius:12px;z-index:30;max-width:calc(100% - 32px)}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<nav class="tabs" aria-label="Категории целей">
  <div class="tabs-in" role="tablist"><span class="ind" aria-hidden="true"></span>
    <button class="tab" role="tab" data-cat="ny" id="tab-ny">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l4 6h-2.5l3.5 5h-2.5l3.5 5H6l3.5-5H7l3.5-5H8z"/><path d="M12 19v2.5"/></svg></span>До НГ
    </button>
    <button class="tab" role="tab" data-cat="month" id="tab-month">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h2M14 14h2M8 17h2"/></svg></span>Месяц
    </button>
    <button class="tab" role="tab" data-cat="week" id="tab-week">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7v10M7.3 9v8M10.6 6v11M14 10v7M17.3 8v9M20.6 12v5"/></svg></span>Неделя
    </button>
  </div>
</nav>

<script>
(function(){
const CATS={
  ny:{name:'До Нового года',short:'До НГ'},
  month:{name:'Цели на месяц',short:'Месяц'},
  week:{name:'Цели на неделю',short:'Неделя'}
};
const LS='tseli-app-v1';
const ICON={
  minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

/* ---------- state ---------- */
let goals={};            // id -> goal
let settings={month:{},week:{}};
const BUILTIN=['Познакомиться с девушкой','Сходить в спортзал','Пробежка','Прочитать книгу','Лечь спать до 00:00','Выучить 10 новых слов','Медитация 10 минут','День без сладкого','Холодный душ','Позвонить родителям'];
let templates=null; // null = ещё не менялись, показываем стандартные
let hiddenTpl=[];
let logs={};      // история +1 по дням: id -> {key,title,base,days:{'2026-09-20':n}}
let sums={};
let trash={};     // корзина: id -> {g:цель, at:время удаления}; хранится 30 дней      // итоги периодов: id -> {cat,label,start,end,items,avg,doneN,total,seen}   // скрытые подсказки из существующих целей (нормализованные названия)
let tab='week';
try{const t=localStorage.getItem(LS+':tab');if(t&&CATS[t])tab=t;}catch(e){}

function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function fmt(d){return d.getDate()+' '+MON[d.getMonth()]}
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}
function uid(){return 'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function periodEnd(cat){ // момент окончания периода
  if(cat==='ny'){const t=new Date();return new Date(t.getFullYear()+1,0,1)}
  const p=settings[cat]||{};const e=parse(p.end);if(!e)return null;return new Date(e.getFullYear(),e.getMonth(),e.getDate()+1);
}
function periodStart(cat){if(cat==='ny')return null;const p=settings[cat]||{};return parse(p.start)}
function dur(ms,short){ // «2 дня 6 часов» / коротко «2 дня 6ч», «5ч 20мин»
  const m=Math.max(1,Math.round(ms/6e4));const d=Math.floor(m/1440),h=Math.floor(m%1440/60),mi=m%60;
  const P=(n,a,b,c)=>n+' '+plural(n,a,b,c);
  const H=n=>short?n+'ч':P(n,'час','часа','часов'), M=n=>short?n+'мин':P(n,'минута','минуты','минут');
  if(d>0)return P(d,'день','дня','дней')+(h?' '+H(h):'');
  if(h>0)return H(h)+(mi?' '+M(mi):'');
  return M(mi);
}
function paceHTML(g){
  if(g.kind!=='count'||isDone(g))return'';
  const left=g.target-(g.done||0);const end=periodEnd(g.cat);
  if(!end)return '<div class="pace">Укажите даты периода, чтобы увидеть темп</div>';
  const now=new Date();const st=periodStart(g.cat);const from=st&&st>now?st:now;
  const ms=end-from;
  if(ms<=0)return '<div class="pace late">Срок вышел</div>';
  return '<div class="pace"><b>+1 каждые '+dur(ms/left,true)+'</b></div>';
}
const TRASH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.8 12.2a1.5 1.5 0 0 0 1.5 1.3h6.4a1.5 1.5 0 0 0 1.5-1.3L17.5 7M10 11v6M14 11v6"/></svg>';
const ARCHSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="4.5" rx="1.2"/><path d="M5 9v9.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V9M10 13h4"/></svg>';
function ordOf(g){return g.order!=null?g.order:(g.created||0)}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function fmtRange(s,e){return fmt(s)+' — '+fmt(e)}
function isCalMonth(s,e){return s.getDate()===1&&e.getMonth()===s.getMonth()&&addDays(e,1).getDate()===1}
function nextPeriod(s,e){
  if(isCalMonth(s,e)){const ns=new Date(e.getFullYear(),e.getMonth()+1,1);return [ns,new Date(ns.getFullYear(),ns.getMonth()+1,0)]}
  const len=Math.round((e-s)/864e5)+1,ns=addDays(e,1);return [ns,addDays(ns,len-1)];
}
let canRoll=false;
function maybeRoll(){ // автопереход: прошлые цели в архив, новые с нуля
  if(!canRoll)return false;purgeTrash();let any=false;const t=today();
  ['month','week'].forEach(cat=>{
    const p=settings[cat]||{};if(p.auto===false)return;
    const s=parse(p.start),e=parse(p.end);if(!s||!e||t<=e)return;
    let [ns,ne]=nextPeriod(s,e),guard=0;while(ne<t&&guard++<600)[ns,ne]=nextPeriod(ns,ne);
    const label=fmtRange(s,e),tag=iso(ns).replace(/-/g,'');
    const cur=Object.values(goals).filter(g=>g.cat===cat&&!g.archived&&!g.example).sort((a,b)=>ordOf(a)-ordOf(b));
    if(cur.length){const sid=cat+'_'+p.start.replace(/-/g,'');
      if(!sums[sid]){sums[sid]={cat,label,start:p.start,end:p.end,items:cur.map(g=>({title:g.title,kind:g.kind,done:g.done||0,target:g.target})),
        avg:Math.round(cur.reduce((a,g)=>a+progress(g),0)/cur.length*100),doneN:cur.filter(isDone).length,total:cur.length,seen:false};putSum(sid)}}
    Object.keys(goals).forEach(k=>{const g=goals[k];if(g.cat!==cat||g.archived||g.example)return;
      const nid=k.split('~')[0]+'~'+tag;
      if(!goals[nid]){const n={cat,title:g.title,kind:g.kind,target:g.target,done:0,created:g.created,order:ordOf(g)};if(g.sync===false)n.sync=false;goals[nid]=n;putGoal(nid)}
      g.archived=true;g.archivedAt=Date.now();g.period=label;putGoal(k)});
    settings[cat]=Object.assign({},p,{start:iso(ns),end:iso(ne)});any=true;
  });
  let nyRolled=false;
  if(settings.nyYear==null){settings.nyYear=t.getFullYear();putSettings()}
  else if(t.getFullYear()>settings.nyYear){
    const yr=settings.nyYear,sid='ny_'+yr;
    if(!sums[sid]){sums[sid]=buildNYSum(yr);putSum(sid)}
    Object.keys(goals).forEach(k=>{const g=goals[k];if(g.cat!=='ny'||g.archived||g.example)return;
      const nid=k.split('~')[0]+'~Y'+(yr+1);
      if(!goals[nid]){const n={cat:'ny',title:g.title,kind:g.kind,target:g.target,done:0,created:g.created,order:ordOf(g)};if(g.sync===false)n.sync=false;goals[nid]=n;putGoal(nid)}
      g.archived=true;g.archivedAt=Date.now();g.period=yr+' год';putGoal(k)});
    settings.nyYear=t.getFullYear();nyRolled=true;any=true;
  }
  if(any){putSettings();if(!nyRolled)setTimeout(()=>toast('Начался новый период — прошлые цели в архиве'),400)}
  return any;
}
/* ---------- история и рекорды ---------- */
function lidOf(title){let h=5381;const k=norm(title);for(let i=0;i<k.length;i++)h=((h<<5)+h+k.charCodeAt(i))>>>0;return 'l'+h.toString(36)}
function dayCounts(L){return L?Object.entries(L.days||{}).filter(([,n])=>n>0).sort((a,b)=>a[0]<b[0]?-1:1):[]}
function logEvent(title,d,baseGuess){
  const id=lidOf(title);let L=logs[id];
  if(!L){L=logs[id]={key:norm(title),title,base:Math.max(0,baseGuess||0),days:{}}}
  const t=iso(today());
  if(d>0)L.days[t]=(L.days[t]||0)+d;
  else{const dc=dayCounts(L);if(dc.length){const [k]=dc[dc.length-1];L.days[k]--;if(!L.days[k])delete L.days[k]}else L.base=Math.max(0,(L.base||0)-1)}
  putLog(id);
}
function streaks(L){
  const dc=dayCounts(L).map(([k])=>k);let best=0,run=0,prev=null,bestEnd=null;
  dc.forEach(k=>{const d=parse(k);run=prev&&Math.round((d-prev)/864e5)===1?run+1:1;if(run>best){best=run;bestEnd=k}prev=d});
  let current=0;if(dc.length){const last=parse(dc[dc.length-1]);const gap=Math.round((today()-last)/864e5);if(gap<=1){current=1;for(let i=dc.length-1;i>0;i--){if(Math.round((parse(dc[i])-parse(dc[i-1]))/864e5)===1)current++;else break}}}
  return {best,current};
}
function bestPeriod(title,cat,exceptId){let b=null;const k=norm(title);
  Object.entries(goals).forEach(([id,g])=>{if(id===exceptId||g.cat!==cat||!g.archived||g.example||norm(g.title)!==k||g.kind!=='count')return;if(!b||(g.done||0)>b.v)b={v:g.done||0,label:g.period||''}});return b}
function recordsFor(title){
  const k=norm(title),L=logs[lidOf(title)],r={};
  const w=bestPeriod(title,'week'),m=bestPeriod(title,'month');if(w&&w.v)r.week=w;if(m&&m.v)r.month=m;
  const dc=dayCounts(L);if(dc.length){const [dk,dv]=dc.reduce((a,b)=>b[1]>a[1]?b:a);r.day={v:dv,label:fmt(parse(dk))};
    const st=streaks(L);if(st.best>1)r.streak=st.best;if(st.current>1)r.cur=st.current;
    r.total=(L.base||0)+dc.reduce((a,[,n])=>a+n,0)}
  else if(L&&L.base)r.total=L.base;
  let fast=null;Object.values(goals).forEach(g=>{if(norm(g.title)!==k||g.doneIn==null||g.example)return;if(!fast||g.doneIn<fast.v)fast={v:g.doneIn,cat:g.cat,target:g.target}});if(fast)r.fast=fast;
  return r;
}
const TROPHY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/></svg>';
function recsHTML(title,withHead){
  const r=recordsFor(title),rows=[];const dn=n=>n+' '+plural(n,'день','дня','дней');
  if(r.week)rows.push(['Лучшая неделя',r.week.v,r.week.label]);
  if(r.month)rows.push(['Лучший месяц',r.month.v,r.month.label]);
  if(r.day)rows.push(['Больше всего за день',r.day.v,r.day.label]);
  if(r.streak)rows.push(['Самая длинная серия',dn(r.streak),r.cur>1?'сейчас '+dn(r.cur)+' подряд':'дней подряд с +1']);
  if(r.fast)rows.push(['Быстрее всего выполнена',dn(r.fast.v),(r.fast.cat==='week'?'недельная':r.fast.cat==='month'?'месячная':'до НГ')+' цель на '+r.fast.target]);
  if(r.total)rows.push(['Всего',r.total,'за всё время']);
  if(!rows.length)return withHead?'<div class="recs"><div class="rh">'+TROPHY+'Рекорды</div><div class="rl" style="grid-column:1/-1">Появятся, когда накопится история: лучший день, серии, лучшие недели и месяцы.</div></div>':'';
  return '<div class="recs">'+(withHead?'<div class="rh">'+TROPHY+'Рекорды</div>':'')+rows.map(([l,v,sub])=>'<div class="rl">'+l+'</div><div class="rv">'+v+(sub?'<small>'+esc(sub)+'</small>':'')+'</div>').join('')+'</div>';
}
function recHintHTML(g,id){
  if(g.kind!=='count'||(g.cat!=='week'&&g.cat!=='month'))return'';
  const b=bestPeriod(g.title,g.cat,id);if(!b||!b.v)return'';const cur=g.done||0,nm=g.cat==='week'?'недели':'месяца';
  if(cur>b.v)return '<div class="rec hot">'+TROPHY+'Новый рекорд '+nm+'! Прошлый — '+b.v+'</div>';
  if(cur>0&&b.v+1-cur<=3)return '<div class="rec">'+TROPHY+'До рекорда '+nm+': '+(b.v+1-cur)+'</div>';
  return'';
}
function periodStartFor(cat){return cat==='ny'?null:parse((settings[cat]||{}).start)}

/* ---------- мотивация ---------- */
const PHRASES={
  p100:['Идеальный период — все цели закрыты. Запомни это ощущение.','100%. Ты сделал всё, что задумал. Это уровень.','Чистая победа. Так выглядит дисциплина.'],
  p80:['Сильный период — почти всё сделано. Ещё чуть-чуть, и будет идеально.','Отличный результат. Ты был в шаге от максимума.','Мощно! Такой темп — уже привычка, а не случайность.'],
  p50:['Больше половины пути пройдено — это настоящий прогресс.','Хорошая база. В новом периоде добавь немного темпа.','Неплохо! Посмотри, какая цель отстала, — начни с неё.'],
  p20:['Период был непростым, но ты не остановился. Это главное.','Начало положено. Новый период — новый шанс.','Каждый +1 считается. Продолжай — результат накопится.'],
  p0:['Бывает. Главное — не бросать. Новый период уже начался.','Не всё пошло по плану — это нормально. Попробуй цели чуть поменьше.','Сегодня отличный день, чтобы начать заново.'],
  up:['И это лучше, чем в прошлый раз — ты растёшь.','Прогресс налицо: ты обогнал себя прошлого.'],

    const r=e.target.closest('[data-r]'),d=e.target.closest('[data-d]');
    if(r){const g=goals[r.dataset.r];g.archived=false;delete g.archivedAt;delete g.period;g.order=Date.now();putGoal(r.dataset.r);paint();render();toast('Цель возвращена')}
    if(d){if(d.dataset.armed){trashGoal(d.dataset.d);paint();render();toast('Цель удалена')}else{d.dataset.armed='1';d.textContent='Точно?'}}
  });
}

function openPeriod(){
  const cat=tab,p=settings[cat]||{};
  const t=today();let ds=p.start,de=p.end;
  const s=sheet(
    '<h2>Даты · '+CATS[cat].short+'</h2>'+
    '<div class="two"><div class="field"><label for="p-start">Начало</label><input id="p-start" type="date" value="'+(ds||'')+'"></div>'+
    '<div class="field"><label for="p-end">Конец</label><input id="p-end" type="date" value="'+(de||'')+'"></div></div>'+
    '<label class="tick"><input type="checkbox" id="p-auto" '+(p.auto===false?'':'checked')+'><span>Начинать новый период автоматически<small>Когда период закончится, даты сдвинутся на следующий такой же срок (для календарного месяца — на следующий месяц). Цели начнутся заново с нуля, а прошлые уйдут в архив.</small></span></label>'+
    '<div class="err" id="p-err"></div>'+
    '<div class="actions"><button class="btn" id="p-cancel">Отмена</button><button class="btn primary" id="p-save">Сохранить</button></div>'
  );
  s.querySelector('#p-cancel').onclick=closeSheet;
  s.querySelector('#p-save').onclick=()=>{
    const a=s.querySelector('#p-start').value,b=s.querySelector('#p-end').value,err=s.querySelector('#p-err');
    if(!a||!b){err.textContent='Укажите обе даты';return}
    if(parse(b)<parse(a)){err.textContent='Конец не может быть раньше начала';return}
    settings[cat]={start:a,end:b,auto:s.querySelector('#p-auto').checked};putSettings();closeSheet();
    if(maybeRoll()){}render();toast('Даты сохранены');
  };
}


function openBackup(){
  const s=sheet('<h2>Резервная копия</h2><p class="hint" style="margin:0 0 14px">Цели хранятся только на этом телефоне. Сохраните копию в файл, чтобы перенести их на другое устройство или не потерять при удалении приложения.</p>'+
   '<div class="actions" style="flex-direction:column"><button class="btn primary" id="b-exp">Сохранить копию в файл</button><button class="btn" id="b-imp">Загрузить из файла</button><button class="btn" id="b-close">Закрыть</button></div><input type="file" id="b-file" accept="application/json,.json" hidden>');
  s.querySelector('#b-close').onclick=closeSheet;
  s.querySelector('#b-exp').onclick=async()=>{
    const data=JSON.stringify({app:'tseli',v:4,saved:new Date().toISOString(),goals,settings,templates,hiddenTpl,logs,sums,trash},null,1);
    const name='tseli-'+iso(today())+'.json';
    const file=new File([data],name,{type:'application/json'});
    const mark=()=>{settings.lastBackup=Date.now();settings.backupSnooze=0;saveLocal();render()};
    try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Цели — копия'});mark();closeSheet();toast('Копия сохранена');return} }catch(e){if(e&&e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);mark();closeSheet();toast('Файл сохранён');
  };
  const inp=s.querySelector('#b-file');
  s.querySelector('#b-imp').onclick=()=>inp.click();
  inp.onchange=async()=>{
    try{const r=JSON.parse(await inp.files[0].text());if(!r||typeof r.goals!=='object')throw 0;
      goals=r.goals;settings=Object.assign({month:{},week:{}},r.settings||{});
      if(Array.isArray(r.templates))templates=r.templates;if(Array.isArray(r.hiddenTpl))hiddenTpl=r.hiddenTpl;if(r.logs)logs=r.logs;if(r.sums)sums=r.sums;if(r.trash)trash=r.trash;
      saveLocal();closeSheet();render();toast('Цели загружены');
    }catch(e){toast('Это не файл копии целей')}
  };
}

let tt;function toast(m){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;el.offsetWidth;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>{el.classList.remove('show')},2000)}

/* ---------- boot ---------- */
setInterval(()=>{const r=maybeRoll();applyTheme();if(!scrim||r)render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&maybeRoll())render()});
const hadLocal=loadLocal();
if(!hadLocal)seed();
render();

canRoll=true;if(maybeRoll())render();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
</script>
